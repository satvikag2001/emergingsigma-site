# Builds emergingsigma.com with Next.js and publishes it to GitHub Pages.
#
# `next build` writes the whole site as static files to out/ (output: "export"
# in next.config.ts), so Pages serves plain HTML/CSS/JS and no server runs.
#
# The repo never stores real keys. They live in GitHub Actions secrets and are
# handed to the build as NEXT_PUBLIC_* variables, which Next.js bakes into the
# pages. Set these under Settings > Secrets and variables > Actions:
#   WEB3FORMS_ACCESS_KEY   Web3Forms access key                  (contact forms)
#   CF_BEACON_TOKEN        Cloudflare Web Analytics site token   (analytics)
#
# Either may be left unset: the build warns and ships that feature switched off
# rather than failing, so a missing secret can never take the site down.
#
# Note both values are still readable in the delivered page by any visitor. That
# is unavoidable for a static site - the browser has to send them. Keeping them
# out of the repo is the goal here, not keeping them from visitors.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Warn about missing secrets
        env:
          WEB3FORMS_ACCESS_KEY: ${{ secrets.WEB3FORMS_ACCESS_KEY }}
          CF_BEACON_TOKEN: ${{ secrets.CF_BEACON_TOKEN }}
        run: |
          [ -n "$WEB3FORMS_ACCESS_KEY" ] || echo "::warning::WEB3FORMS_ACCESS_KEY not set - contact forms stay disabled."
          [ -n "$CF_BEACON_TOKEN" ] || echo "::warning::CF_BEACON_TOKEN not set - deploying with analytics off."

      # Asset filenames are content-hashed by Next.js, so returning visitors
      # always fetch the current CSS and JS; there is nothing to version by hand.
      - name: Build
        env:
          NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY: ${{ secrets.WEB3FORMS_ACCESS_KEY }}
          NEXT_PUBLIC_CF_BEACON_TOKEN: ${{ secrets.CF_BEACON_TOKEN }}
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build

      - name: Check the build output
        run: |
          test -f out/CNAME || {
            echo "::error::CNAME is missing - the custom domain would break."; exit 1; }
          test -f out/404.html || {
            echo "::error::404.html is missing - GitHub Pages would show its own error page."; exit 1; }

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
