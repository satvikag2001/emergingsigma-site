<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Layout check</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="style.css?v=11">
<style>
  body{font-family:'Open Sans',system-ui,sans-serif;padding:0;margin:0}
  .panel{max-width:760px;margin:40px auto;padding:0 24px}
  .row{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid #dde8e4;font-size:14px}
  .row b{min-width:230px}
  .verdict{padding:18px 22px;border-radius:10px;font-weight:700;font-size:17px;margin:22px 0}
  .good{background:#eaf6e3;color:#2f5c16;border:2px solid #7cc04a}
  .bad{background:#fdecea;color:#8e2b21;border:2px solid #e2857a}
  code{background:#eef2f0;padding:2px 6px;border-radius:4px;font-size:13px}
  .ruler{position:fixed;top:0;bottom:0;width:2px;background:#e5195f;z-index:9999}
  .ruler span{position:absolute;top:4px;left:5px;background:#e5195f;color:#fff;font:11px monospace;padding:2px 5px;border-radius:3px;white-space:nowrap}
</style>
</head>
<body>

<!-- a real nav, so the logo position can be compared directly -->
<header class="site-nav">
  <div class="wrap">
    <nav class="nav-wrap">
      <a href="index.html" class="nav-logo"><img src="assets/logo.png" alt="Emerging Sigma Consulting" width="722" height="128"></a>
    </nav>
  </div>
</header>

<div class="panel">
  <h1 style="font-size:26px;margin-bottom:6px;">Layout check</h1>
  <p style="margin-bottom:20px;">This page reads the stylesheet your browser actually loaded.</p>
  <div id="out"></div>
  <div id="verdict"></div>
  <p style="font-size:13px;color:#4a6560;margin-top:24px;">
    The pink line marks the left edge of the logo above. On the updated
    stylesheet it sits close to the window edge; on the old one it is far in.
  </p>
</div>

<script>
(function () {
  var probe = document.createElement('div');
  probe.className = 'wrap';
  probe.style.visibility = 'hidden';
  document.body.appendChild(probe);
  var cs = getComputedStyle(probe);
  var maxw = cs.maxWidth, pad = cs.paddingLeft;
  probe.remove();

  var logo = document.querySelector('.nav-logo');
  var left = Math.round(logo.getBoundingClientRect().left);

  var isNew = maxw === '1600px';

  var rows = [
    ['Page you are viewing', location.href],
    ['Window width', window.innerWidth + ' px'],
    ['.wrap max-width', maxw + (isNew ? '   (updated)' : '   (OLD - expected 1600px)')],
    ['.wrap side padding', pad],
    ['Logo left edge', left + ' px from window edge']
  ];
  document.getElementById('out').innerHTML = rows.map(function (r) {
    return '<div class="row"><b>' + r[0] + '</b><span>' + r[1] + '</span></div>';
  }).join('');

  document.getElementById('verdict').innerHTML = isNew
    ? '<div class="verdict good">You ARE on the updated stylesheet. Any layout you dislike is a design choice I can change, not a caching problem.</div>'
    : '<div class="verdict bad">You are on the OLD stylesheet. The browser is serving a cached copy, or this folder is not the one I have been editing. Nothing I changed will be visible here.</div>';

  var ruler = document.createElement('div');
  ruler.className = 'ruler';
  ruler.style.left = left + 'px';
  ruler.innerHTML = '<span>logo starts at ' + left + 'px</span>';
  document.body.appendChild(ruler);
})();
</script>
</body>
</html>
